name: 단가 수집

on:
  schedule:
    - cron: "17 21 * * 0"   # 매주 월요일 오전 6:17 (한국 시간)
  workflow_dispatch:         # Actions 탭에서 'Run workflow'로 바로 실행

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 조달청 가격 수집
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          ALERT_THRESHOLD: "5"
          BACKFILL_FROM: "20250101"
        run: python collect.py

      - name: 수집 결과 저장
        run: |
          git config user.name "danga-bot"
          git config user.email "danga-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "단가 수집 $(date +%Y-%m-%d)"
          git push

      - name: 가격 변동 알림 (이슈 등록 → 메일 발송)
        if: hashFiles('data/changes.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "가격 변동 알림 $(date +%Y-%m-%d)" \
            --body-file data/changes.md

      - name: 웹앱 파일 모으기
        run: |
          mkdir -p _site/data
          cp site/index.html _site/
          cp data/prices.json _site/data/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
